name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - name: Testes da skill
        run: npm test
      - name: Exemplo 01 · versão com desvios tem que reprovar
        run: "! bash examples/01-landing-demo/run.sh"
      - name: Exemplo 01 · versão corrigida tem que passar
        run: bash examples/01-landing-demo/run.sh site-corrigido
